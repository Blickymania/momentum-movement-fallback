build:
  system: auto

start_command: "bun run recovered-functions/blickymania-bot-005.ts"

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.2
  min_memory: 256
  max_memory: 384
  min_replicas: 1
  max_replicas: 1

health_check:
  type: http
  http_path: "/healthz"
  interval_in_seconds: 10
