name: Failover foundation tests

on:
  push:
    paths:
      - "implementation/**"
      - "cloudflare/**"
      - "candidate/**"
      - "package.json"
      - ".github/workflows/failover-tests.yml"
  pull_request:
    paths:
      - "implementation/**"
      - "cloudflare/**"
      - "candidate/**"
      - "package.json"
      - ".github/workflows/failover-tests.yml"

permissions:
  contents: read

jobs:
  lease-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run lease unit tests
        run: npm test
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4.161.0 deploy --dry-run --config cloudflare/wrangler.jsonc --outdir /tmp/mm-cloudflare-worker-bundle
