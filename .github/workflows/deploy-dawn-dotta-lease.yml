name: Deploy Momentum Movement lease coordinator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-lease-coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEASE_CONTROL_TOKEN: ${{ secrets.LEASE_CONTROL_TOKEN }}
    steps:
      - name: Check out Dawn Dotta recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/dawn-dotta-backend-2026-11-13
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -eu
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LEASE_CONTROL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done
      - name: Run failover unit and wiring tests
        run: node --test failover/tests/*.test.mjs
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy SQLite Durable Object coordinator with protected secret
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/momentum-movement-worker-secrets.env"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          printf 'LEASE_CONTROL_TOKEN=%s\n' "$LEASE_CONTROL_TOKEN" > "$secret_file"
          wrangler deploy --config failover/lease-control/wrangler.jsonc --secrets-file "$secret_file"
