name: Validate Cloudflare free migration candidate

on:
  push:
    branches:
      - infra/cloudflare-free-migration
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "migrations/**"
      - "wrangler.toml.example"
      - "package.json"
      - ".github/workflows/cloudflare-free-migration-checks.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check and unit tests
        run: npm run check && npm test
