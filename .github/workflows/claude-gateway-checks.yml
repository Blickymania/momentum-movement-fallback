name: Claude Gateway Checks

on:
  push:
    branches:
      - infra/claude-five-server-gateway-staging
    paths:
      - "claude-gateway/**"
      - ".github/workflows/claude-gateway-checks.yml"
  pull_request:
    branches:
      - infra/claude-five-server-gateway-staging
    paths:
      - "claude-gateway/**"
      - ".github/workflows/claude-gateway-checks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-gateway-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck-and-test:
    name: TypeScript, unit, and Workers integration tests (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: claude-gateway
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-gateway/package-lock.json

      - name: Regenerate incomplete lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean locked dependency installation
        run: npm ci --no-audit --no-fund

      - name: Run strict TypeScript and unit checks
        run: npm run check

      - name: Run Cloudflare Workers integration suites
        run: npm run test:workers

      - name: Commit reconciled lockfile to staging
        if: success()
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already complete; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: reconcile Claude gateway lockfile"
          git push
